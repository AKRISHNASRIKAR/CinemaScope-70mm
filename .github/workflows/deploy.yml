name: Deploy — Migrations + Edge Functions

# Runs on every push to master.
# Vercel deploys the frontend automatically via its GitHub integration
# (no action step needed here — just configure it once in the Vercel dashboard).
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   SUPABASE_ACCESS_TOKEN   — your personal Supabase access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_REF    — your project reference ID (e.g. "abcxyzabcxyz")
#   SUPABASE_DB_PASSWORD    — your database password (needed for db push)

on:
  push:
    branches:
      - master
  workflow_dispatch: # allow manual trigger from GitHub UI

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false # never cancel a running deploy — avoid partial states

jobs:
  # ── Job 1: Run DB migrations ──────────────────────────────────────────────
  migrate:
    name: Run database migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run migrations
        run: |
          supabase db push \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} \
            --password ${{ secrets.SUPABASE_DB_PASSWORD }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        working-directory: backend

  # ── Job 2: Deploy Edge Functions ─────────────────────────────────────────
  deploy-functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    needs: migrate # migrations must complete before new function code goes live
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all Edge Functions
        run: |
          supabase functions deploy \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} \
            --no-verify-jwt tmdb
          supabase functions deploy \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} \
            profile
          supabase functions deploy \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} \
            watch-history
          supabase functions deploy \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} \
            watchlist
          supabase functions deploy \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} \
            reviews
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        working-directory: backend

  # ── Job 3: Smoke-test deployed functions ─────────────────────────────────
  smoke-test:
    name: Smoke test (TMDB proxy)
    runs-on: ubuntu-latest
    needs: deploy-functions
    steps:
      - name: Ping TMDB proxy (popular movies)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_PROJECT_URL }}/functions/v1/tmdb/movie/popular" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "TMDB proxy returned HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test FAILED — expected 200, got $STATUS"
            exit 1
          fi
